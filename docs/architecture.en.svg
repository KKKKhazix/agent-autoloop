<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 628" role="img" aria-labelledby="t">
<title id="t">Agent Autoloop architecture: a kernel in the middle, everything else a plugin</title>
<defs>
<style>
svg{--bg:#faf9f5;--ink:#1d1c19;--muted:#6e6b64;--line:#d6d3cb;--card:#fff;--item:#f4f2ec;--accent:#c2491d;--core:#1d1c19;--core-ink:#faf9f5;--core-chip:#2f2d28;--core-sub:#b9b5ab;--core-accent:#ef8a62;--you-bg:#fff4ee}
@media (prefers-color-scheme:dark){svg{--bg:#151412;--ink:#f1efe9;--muted:#a29e95;--line:#45433d;--card:#1e1d1a;--item:#262420;--accent:#ef8a62;--core:#f1efe9;--core-ink:#1d1c19;--core-chip:#dfdcd3;--core-sub:#5f5c55;--core-accent:#c2491d;--you-bg:#2a1f1a}}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:14px;fill:var(--ink)}
.h2{font-size:17px;font-weight:600}
.s{font-size:12.5px;fill:var(--muted)}
.r{font-size:13.5px}
.l{font-size:13.5px;font-weight:600;fill:var(--accent)}
.bg{fill:var(--bg)}
.plug{fill:var(--card);stroke:var(--muted);stroke-width:1.3;stroke-dasharray:6 5}
.item{fill:var(--item);stroke:var(--line)}
.loop-pill{fill:var(--you-bg);stroke:var(--accent);stroke-width:1.4}
.loop-text{font-size:13px;font-weight:600;fill:var(--accent)}
.more{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.dot{fill:var(--muted)}
.core{fill:var(--core);stroke:var(--core-accent);stroke-width:2}
.chip{fill:var(--core-chip)}
.ct{font-size:23px;font-weight:700;fill:var(--core-ink)}
.cte{font-size:21px;font-weight:700;fill:var(--core-ink)}
.cs{font-size:12.5px;fill:var(--core-sub)}
.cn{font-size:15px;font-weight:600;fill:var(--core-ink)}
.cd{font-size:12px;fill:var(--core-sub)}
.you{fill:var(--you-bg);stroke:var(--accent);stroke-width:2.4}
.you-t{font-size:20px;font-weight:700;fill:var(--accent)}
.you-s{font-size:13px;font-weight:600;fill:var(--ink)}
.badge{fill:var(--accent)}
.n{font-size:12.5px;font-weight:700;fill:var(--bg)}
.conn{fill:none;stroke:var(--accent);stroke-width:2.1;marker-end:url(#a)}
.back{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:6 4;marker-end:url(#a)}
.flow{fill:none;stroke:var(--muted);stroke-width:1.4;marker-end:url(#b)}
.both{fill:none;stroke:var(--accent);stroke-width:1.8;marker-start:url(#a);marker-end:url(#a)}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="628" rx="18"/>

<!-- Top auto-loop arc: finish directly / scheduled follow-up -> back to kernel -->
<path class="back" d="M838 66V28H480V63"/>
<rect class="loop-pill" x="476" y="13" width="356" height="30" rx="15"/>
<text x="654" y="33" class="loop-text" text-anchor="middle">Auto-loop: done · scheduled check · new events</text>

<!-- Left: Event plugins -->
<rect class="plug" x="24" y="68" width="196" height="264" rx="14"/>
<text x="42" y="98" class="h2">Event plugins</text>
<text x="42" y="118" class="s">Changes become events</text>
<rect class="item" x="40" y="136" width="164" height="32" rx="8"/>
<text x="122" y="157" class="r" text-anchor="middle">Schedules</text>
<rect class="item" x="40" y="176" width="164" height="32" rx="8"/>
<text x="122" y="197" class="r" text-anchor="middle">GitHub</text>
<rect class="item" x="40" y="216" width="164" height="32" rx="8"/>
<text x="122" y="237" class="r" text-anchor="middle">Your systems</text>
<rect class="item" x="40" y="256" width="164" height="32" rx="8"/>
<text x="122" y="277" class="r" text-anchor="middle">Polling script</text>
<rect class="more" x="40" y="296" width="164" height="24" rx="8"/>
<circle class="dot" cx="110" cy="308" r="2.4"/>
<circle class="dot" cx="122" cy="308" r="2.4"/>
<circle class="dot" cx="134" cy="308" r="2.4"/>

<!-- 1: event -->
<path class="conn" d="M222 200H286"/>
<circle class="badge" cx="254" cy="177" r="12"/>
<text x="254" y="181.5" class="n" text-anchor="middle">1</text>
<text x="254" y="220" class="l" text-anchor="middle">event</text>

<!-- Center: Autoloop kernel -->
<rect class="core" x="290" y="68" width="380" height="264" rx="22"/>
<text x="316" y="106" class="cte">Autoloop kernel</text>
<text x="516" y="104" class="cs">Indexed state · 0 deps</text>

<rect class="chip" x="312" y="124" width="336" height="54" rx="10"/>
<text x="480" y="148" class="cn" text-anchor="middle">1. Route &amp; batch by rules</text>
<text x="480" y="167" class="cd" text-anchor="middle">picks agent &amp; folder · dedupes same subject</text>

<rect class="chip" x="312" y="188" width="336" height="54" rx="10"/>
<text x="480" y="212" class="cn" text-anchor="middle">2. Sole deterministic decider</text>
<text x="480" y="231" class="cd" text-anchor="middle">no outbound requests · same input, same result</text>

<rect class="chip" x="312" y="252" width="336" height="60" rx="10"/>
<text x="480" y="276" class="cn" text-anchor="middle">3. One append-only log &amp; due table</text>
<text x="480" y="296" class="cd" text-anchor="middle">crash-safe · traceable · 0 processes while waiting</text>

<!-- 2 & 3: work & receipt -->
<path class="conn" d="M672 166H736"/>
<circle class="badge" cx="704" cy="143" r="12"/>
<text x="704" y="147.5" class="n" text-anchor="middle">2</text>
<text x="704" y="186" class="l" text-anchor="middle">work</text>

<path class="conn" d="M736 242H672"/>
<circle class="badge" cx="704" cy="219" r="12"/>
<text x="704" y="223.5" class="n" text-anchor="middle">3</text>
<text x="704" y="262" class="l" text-anchor="middle">receipt</text>

<!-- Right: Agent plugins -->
<rect class="plug" x="740" y="68" width="196" height="264" rx="14"/>
<text x="758" y="98" class="h2">Agent plugins</text>
<text x="758" y="118" class="s">Work one round, then exit</text>
<rect class="item" x="756" y="136" width="164" height="32" rx="8"/>
<text x="838" y="157" class="r" text-anchor="middle">Claude Code</text>
<rect class="item" x="756" y="176" width="164" height="32" rx="8"/>
<text x="838" y="197" class="r" text-anchor="middle">Codex</text>
<rect class="item" x="756" y="216" width="164" height="32" rx="8"/>
<text x="838" y="237" class="r" text-anchor="middle">DeepSeek Harness</text>
<rect class="item" x="756" y="256" width="164" height="32" rx="8"/>
<text x="838" y="277" class="r" text-anchor="middle">Pi · OpenClaw</text>
<rect class="more" x="756" y="296" width="164" height="24" rx="8"/>
<circle class="dot" cx="826" cy="308" r="2.4"/>
<circle class="dot" cx="838" cy="308" r="2.4"/>
<circle class="dot" cx="850" cy="308" r="2.4"/>

<!-- Bottom human loop: 4 card -> Channel plugins -> You -> 5 answer resumes session -->
<path class="conn" d="M560 334V396"/>
<circle class="badge" cx="560" cy="365" r="12"/>
<text x="560" y="369.5" class="n" text-anchor="middle">4</text>
<text x="580" y="370" class="l">card when needed</text>

<rect class="plug" x="390" y="400" width="546" height="92" rx="14"/>
<text x="410" y="428" class="h2">Channel plugins</text>
<text x="564" y="428" class="s">Cards reach you</text>
<rect class="item" x="410" y="442" width="114" height="36" rx="8"/>
<text x="467" y="465" class="r" text-anchor="middle">Desktop</text>
<rect class="item" x="534" y="442" width="104" height="36" rx="8"/>
<text x="586" y="465" class="r" text-anchor="middle">Feishu</text>
<rect class="item" x="648" y="442" width="126" height="36" rx="8"/>
<text x="711" y="465" class="r" text-anchor="middle">DingTalk · WeCom</text>
<rect class="item" x="784" y="442" width="134" height="36" rx="8"/>
<text x="851" y="465" class="r" text-anchor="middle">Slack · Discord</text>

<path class="both" d="M388 446H328"/>
<rect class="you" x="172" y="402" width="152" height="88" rx="26"/>
<text x="248" y="441" class="you-t" text-anchor="middle">You</text>
<text x="248" y="465" class="you-s" text-anchor="middle">Make the call</text>

<!-- 5: answer -> back to kernel -->
<path class="conn" d="M248 400V358H400V334"/>
<circle class="badge" cx="324" cy="358" r="12"/>
<text x="324" y="362.5" class="n" text-anchor="middle">5</text>
<text x="232" y="363" class="l" text-anchor="end">answer resumes session</text>

<!-- Bottom: Delivery pipeline -->
<rect class="plug" x="24" y="532" width="912" height="72" rx="14"/>
<text x="42" y="562" class="h2">Delivery pipeline</text>
<text x="42" y="584" class="s">also a plugin (event + agent)</text>
<rect class="item" x="260" y="550" width="106" height="36" rx="8"/>
<text x="313" y="573" class="r" text-anchor="middle">Review</text>
<path class="flow" d="M367 568H395"/>
<rect class="item" x="396" y="550" width="106" height="36" rx="8"/>
<text x="449" y="573" class="r" text-anchor="middle">Checks</text>
<path class="flow" d="M503 568H531"/>
<rect class="item" x="532" y="550" width="106" height="36" rx="8"/>
<text x="585" y="573" class="r" text-anchor="middle">Merge</text>
<path class="flow" d="M639 568H667"/>
<rect class="item" x="668" y="550" width="106" height="36" rx="8"/>
<text x="721" y="573" class="r" text-anchor="middle">Ship</text>
<path class="flow" d="M775 568H803"/>
<rect class="item" x="804" y="550" width="112" height="36" rx="8"/>
<text x="860" y="573" class="r" text-anchor="middle">Verify</text>
</svg>
